version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai_workflow_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./workflow_automation.db
      - MOCK_LLM_MODE=true
      - DEFAULT_API_KEY=ai-wf-key-default-admin-2026
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.example.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-automations@example.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    volumes:
      - backend_data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ai_workflow_worker
    command: ["python", "-m", "app.workers.workflow_worker"]
    environment:
      - DATABASE_URL=sqlite:///./workflow_automation.db
      - MOCK_LLM_MODE=true
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - backend_data:/app
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ai_workflow_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
