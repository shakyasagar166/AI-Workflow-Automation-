apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workflow-backend
  labels:
    app: ai-workflow-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-workflow-backend
  template:
    metadata:
      labels:
        app: ai-workflow-backend
    spec:
      containers:
      - name: backend
        image: ai-workflow-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: workflow-secrets
              key: database-url
        - name: MOCK_LLM_MODE
          value: "false"
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-workflow-backend-service
spec:
  selector:
    app: ai-workflow-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
